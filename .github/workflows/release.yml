name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.2
          package-manager-cache: false
      - name: Require a version tag on main
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import assert from "node:assert/strict";
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            assert.equal(process.env.GITHUB_REF_TYPE, "tag", "Dispatch this workflow against a release tag");
            assert.equal(process.env.GITHUB_REF_NAME, "v" + pkg.version, "Tag must match package.json");
          '
          git merge-base --is-ancestor HEAD origin/main
  tests:
    needs: verify
    uses: ./.github/workflows/test.yml
  publish:
    needs: tests
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.2
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.20.0
      - run: npm ci
      - name: Pack and test the exact release artifact
        run: npm run test:package -- --out release
      - name: Publish with npm trusted publishing
        run: node scripts/publish.mjs
      - name: Attach package to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/*.tgz --repo "$GITHUB_REPOSITORY" --clobber
          else
            release_args=()
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then release_args+=(--prerelease); fi
            gh release create "$GITHUB_REF_NAME" release/*.tgz --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "$GITHUB_REF_NAME" --generate-notes "${release_args[@]}"
          fi
