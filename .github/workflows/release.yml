name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.2
          package-manager-cache: false
      - name: Require a version tag on main
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import assert from "node:assert/strict";
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            assert.equal(process.env.GITHUB_REF_TYPE, "tag", "Dispatch this workflow against a release tag");
            assert.equal(process.env.GITHUB_REF_NAME, "v" + pkg.version, "Tag must match package.json");
          '
          git merge-base --is-ancestor HEAD origin/main
  tests:
    needs: verify
    uses: ./.github/workflows/test.yml
  publish:
    needs: tests
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.2
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install publishing tools without replacing the running npm
        run: |
          npm install --prefix "$RUNNER_TEMP/spyret-publish-tools" --no-audit --no-fund --ignore-scripts npm@11.20.0
          echo "$RUNNER_TEMP/spyret-publish-tools/node_modules/.bin" >> "$GITHUB_PATH"
      - run: npm ci
      - name: Pack and test the exact release artifact
        run: npm run test:package -- --out release
      - name: Require Drive release configuration
        env:
          GOOGLE_WIF_PROVIDER: ${{ vars.GOOGLE_WIF_PROVIDER }}
          GOOGLE_SERVICE_ACCOUNT: ${{ vars.GOOGLE_SERVICE_ACCOUNT }}
          SPYRET_DRIVE_FOLDER_ID: ${{ vars.SPYRET_DRIVE_FOLDER_ID }}
        run: |
          test -n "$GOOGLE_WIF_PROVIDER"
          test -n "$GOOGLE_SERVICE_ACCOUNT"
          test -n "$SPYRET_DRIVE_FOLDER_ID"
      - id: google-auth
        name: Authenticate to Google Drive
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WIF_PROVIDER }}
          service_account: ${{ vars.GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive
          create_credentials_file: false
      - name: Publish with npm trusted publishing
        run: node scripts/publish.mjs
      - name: Publish versioned Pyret imports to Google Drive
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          SPYRET_DRIVE_FOLDER_ID: ${{ vars.SPYRET_DRIVE_FOLDER_ID }}
        run: node scripts/publish-drive.mjs
      - name: Attach package to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(release/*.tgz "release/spyret-$GITHUB_REF_NAME.js" "release/spyret-$GITHUB_REF_NAME.arr" "release/spyret-$GITHUB_REF_NAME-drive.json")
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            release_args=()
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then release_args+=(--prerelease); fi
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "$GITHUB_REF_NAME" --generate-notes \
              --notes "$(cat "release/spyret-$GITHUB_REF_NAME-import.md")" "${release_args[@]}"
          fi
