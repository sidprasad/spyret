<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Importable Spyret in upstream Pyret</title>
<style>html,body,#editor{height:100%;margin:0} iframe{width:100%;height:100%;border:0}</style>
<div id="editor"></div>
<script type="module">
  import { makeEmbedConfig } from '/pyret.js';
  import { rpc } from '/default-rpcs.js';
  // pyret-embed 0.1.8's default RPC exports the Pyret spelling, while its
  // filesystem locator requests the JavaScript path method spelling.
  rpc.path.isAbsolute = rpc.path['is-absolute'];
  const readBytes = rpc.fs.readFile;
  rpc.fs.readFile = async path => new TextDecoder().decode(await readBytes(path));
  // Ordinary virtual files, just as an embedding application would provide.
  for (const [name, url] of [
    ['/spytial.arr', '/library/spytial.arr'],
    ['/spyret-browser.js', '/spyret-browser.js']
  ]) {
    const response = await fetch(url);
    if (!response.ok) throw new Error('Cannot load ' + url);
    await rpc.fs.writeFile(name, await response.text());
  }
  window.embedAPI = await makeEmbedConfig({
    container: document.getElementById('editor'),
    src: '/editor.embed.html', rpc,
    state: {
      definitionsAtLastRun: false,
      editorContents: await (await fetch('/example.arr')).text(),
      interactionsSinceLastRun: [], replContents: ''
    },
    options: { footerStyle: 'hide', warnOnExit: false }
  });
</script>
</html>
